services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      WHATSAPP_AUTH_PATH: /data/whatsapp-auth
      DATABASE_PATH: /data/database.sqlite
    volumes:
      - ./data:/data
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
