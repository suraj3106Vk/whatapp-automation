# ── SK Agent Frontend — Netlify config ────────────────────────────────────────

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Railway backend URL
  VITE_API_URL = "https://sk-agent-backend-production.up.railway.app"

# SPA routing — send all routes to index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
