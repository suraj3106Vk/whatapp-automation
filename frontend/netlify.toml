# ── SK Agent Frontend — Netlify config ────────────────────────────────────────

[build]
  base    = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

# IMPORTANT: Set this in Netlify Dashboard > Site Settings > Environment Variables
# VITE_API_URL = https://whatapp-automation-production.up.railway.app

[build.environment]
  NODE_VERSION = "20"

# SPA routing — send all routes to index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
